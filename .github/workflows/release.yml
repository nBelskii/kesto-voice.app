name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.3 && git push origin v0.1.3
#
# Runs on your own Windows desktop registered as a self-hosted runner
# (see plans/ci-setup.md) — this avoids ever uploading the proprietary
# Steamworks SDK anywhere. The SDK must already exist locally at
# C:\kesto-build-cache\steamworks_sdk on that machine.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Steamworks SDK
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "C:\kesto-build-cache\steamworks_sdk" "app\src-tauri\steamworks_sdk"

      - name: Install npm dependencies
        working-directory: app
        run: npm install

      - name: Build signed app
        working-directory: app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish release to kesto-releases
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''

          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$bundleDir/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$bundleDir/*.exe.sig" | Select-Object -First 1
          $sigContent = (Get-Content $sig.FullName -Raw).Trim()

          $latest = @{
            version   = $version
            notes     = "Автоматичний реліз $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url       = "https://github.com/nBelskii/kesto-releases/releases/download/$tag/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "latest.json" -Value $latest -Encoding utf8

          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $body = @{
            tag_name = $tag
            name     = $tag
            body     = "Автоматичний реліз $tag"
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/nBelskii/kesto-releases/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          $uploadBase = ($release.upload_url -replace '\{.*\}', '')

          foreach ($file in @($exe.FullName, $sig.FullName, (Resolve-Path "latest.json").Path)) {
            $name = Split-Path $file -Leaf
            $uploadUrl = "$uploadBase?name=$name"
            Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $file -ContentType "application/octet-stream" | Out-Null
            Write-Host "Uploaded $name"
          }
